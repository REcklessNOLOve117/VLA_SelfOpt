defaults:
  - env/wan_libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:POC_RUN_DIR}
    project_name: rlinf
    experiment_name: wan_libero_spatial_grpo_openvlaoft_lora32
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: 100
  only_eval: false
  val_check_interval: -1
  # Every five steps covers all 10-step recovery points and 25/50/75/100 milestones.
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 5.0
  filter_rewards: true
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 16
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: true
    wan_wm_hf_ckpt_path: ${oc.env:WAN_WM_PATH}
    enable_kir: true
    enable_offload: true
    num_inference_steps: 5
    success_reward_threshold: 0.9
    use_rel_reward: true
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 4
    total_num_envs: 128
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 2048
    group_size: 1
    reset_gripper_open: true
    is_eval: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:OPENVLA_BASE_PATH}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 8192
  seed: 1234
  enable_offload: true
  model:
    model_path: ${oc.env:OPENVLA_BASE_PATH}
    model_type: openvla_oft
    unnorm_key: libero_spatial_no_noops
    max_prompt_length: 128
    is_lora: true
    lora_rank: 32
    lora_path: null
    use_film: false
    num_images_in_input: 1
  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-5
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  # WanEnv owns and loads resnet_rm.pth; no separate reward worker is wanted.
  use_reward_model: false

critic:
  use_critic_model: false
